<div class="worker-card p-4 border rounded shadow mb-2 bg-white">
  <div class="flex justify-between mb-2">
    <h4 class="font-bold">{{ worker.name }} ({{ worker.count }})</h4>
    <span class="text-sm bg-gray-100 px-2 py-1 rounded">Prod: {{ worker.baseProduction }}/s</span>
  </div>

  <div class="actions grid grid-cols-2 gap-2">
    <button 
      (click)="game.hireWorker(worker.id)" 
      [disabled]="!canAfford(worker.hireCost)"
      class="bg-blue-600 text-white px-2 py-1 rounded text-xs disabled:bg-gray-300">
      Contratar ({{ worker.hireCost }} €)
    </button>
    
    <button 
      (click)="game.upgradeWorker(worker.id)"
      [disabled]="!canAfford(worker.upgradeCost) || worker.count === 0"
      class="bg-purple-600 text-white px-2 py-1 rounded text-xs disabled:bg-gray-300">
      Mejorar ({{ worker.upgradeCost }} €)
    </button>
  </div>
  
  <!-- Botón de emergencia -->
  <button *ngIf="worker.count === 0" 
    (click)="game.manualGather(worker.targetResource)"
    class="w-full mt-2 text-xs border border-dashed border-gray-400 py-1">
    Recolectar Manualmente
  </button>
</div>
