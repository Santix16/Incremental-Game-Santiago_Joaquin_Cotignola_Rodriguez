<div class="worker-card">
  
  <div class="card-header">
    <div class="flex-wrapper" style="display:flex; gap:10px; align-items:center;">
      <div class="icon-box">{{ getWorkerIcon() }}</div>
      <div class="worker-info">
        <h4>{{ worker.name }}</h4>
        <div class="worker-lvl">NVL {{ worker.baseProduction }}</div>
      </div>
    </div>
    <div class="worker-count">
      <div class="count-num">{{ worker.count }}</div>
      <div class="count-label">Activos</div>
    </div>
  </div>

  <div class="card-body">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Producción</div>
        <div class="stat-value green">+{{ worker.baseProduction * worker.count }} <small>/s</small></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Velocidad</div>
        <!-- Si está al máximo, mostramos color especial -->
        <div class="stat-value" [class.yellow]="!isMaxed" [class.max-speed]="isMaxed">
          {{ worker.speedMs / 1000 }}s
          <span *ngIf="isMaxed" style="font-size:0.6rem; color:#f472b6;">(MAX)</span>
        </div>
      </div>
    </div>

    <div class="progress-track">
      <!-- Barra llena y de otro color si es MAX -->
      <div class="progress-fill" [class.max-fill]="isMaxed"></div>
    </div>

    <div class="actions">
      <button class="btn-industrial btn-hire" (click)="game.hireWorker(worker.id)" [disabled]="!canAfford(effectiveHireCost)">
        <span class="btn-label">Contratar</span>
        <span class="btn-cost">{{ effectiveHireCost }} €</span>
      </button>

      <!-- Botón Mejorar: Desactivado si es MAX -->
      <button class="btn-industrial btn-upgrade" 
              (click)="game.upgradeWorker(worker.id)" 
              [disabled]="isMaxed || !canAfford(effectiveUpgradeCost) || worker.count === 0"
              [class.maxed-btn]="isMaxed">
        <span class="btn-label">{{ isMaxed ? 'Nivel Máx.' : 'Mejorar' }}</span>
        <span class="btn-cost" *ngIf="!isMaxed">{{ effectiveUpgradeCost }} €</span>
        <span class="btn-cost" *ngIf="isMaxed">---</span>
      </button>
    </div>

    <button *ngIf="worker.count === 0" class="btn-manual" (click)="game.manualGather(worker.targetResource)">
      ⚠️ Recolectar Manual
    </button>
  </div>

</div>
