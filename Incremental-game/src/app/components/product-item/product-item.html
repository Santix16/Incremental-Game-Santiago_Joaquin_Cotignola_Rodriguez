<div class="product-card">
  <!-- Elementos decorativos de fondo -->
  <div class="bg-grid"></div>
  <div class="bg-icon">{{ product.icon }}</div>

  <div class="content">
    
    <!-- Header: Nombre y Stock -->
    <div class="header">
      <div>
        <h4 class="title">{{ product.name }}</h4>
        <div class="stock-badge">
          <span class="dot" [class.active]="product.stock > 0"></span>
          Stock: {{ product.stock }}
        </div>
      </div>
      <!-- Icono principal visible -->
      <div style="font-size: 2.5rem; line-height: 1;">{{ product.icon }}</div>
    </div>

    <!-- Caja de Receta -->
    <div class="recipe-box">
      <span class="recipe-label">Requisitos de Montaje</span>
      <div class="recipe-items">
        <div *ngFor="let req of product.cost" class="res-tag">
          <span>{{ getResourceIcon(req.type) }}</span>
          <strong>{{ req.amount }}</strong>
          <span style="font-size: 0.6rem; opacity: 0.7; text-transform: uppercase;">{{ req.type }}</span>
        </div>
      </div>
    </div>

    <!-- Botonera -->
    <div class="actions">
      <button class="btn btn-craft" (click)="game.craftProduct(product.id)" [disabled]="!canCraft()">
        <span>🔨</span> Fabricar
      </button>
      
      <button class="btn btn-sell" (click)="game.sellProduct(product.id)" [disabled]="product.stock === 0">
        <span>💰</span> {{ product.sellPrice }} €
      </button>
    </div>

  </div>
</div>
