<div class="product-card">
  <div class="bg-grid"></div>
  <div class="bg-icon">{{ product.icon }}</div>

  <div class="content">
    
    <div class="header">
      <div>
        <h4 class="title">{{ product.name }}</h4>
        <div class="stock-badge">
          <span class="dot" [class.active]="product.stock > 0"></span>
          Stock: {{ product.stock }}
        </div>
      </div>
      <div style="font-size: 2.5rem; line-height: 1;">{{ product.icon }}</div>
    </div>

    <div class="recipe-box">
      <span class="recipe-label">Requisitos de Montaje</span>
      <div class="recipe-items">
        <div *ngFor="let req of product.cost" class="res-tag">
          <span>{{ getResourceIcon(req.type) }}</span>
          <!-- Mostramos la cantidad requerida ajustada por dificultad -->
          <strong>{{ getReqAmount(req.amount) }}</strong>
          <span style="font-size: 0.6rem; opacity: 0.7; text-transform: uppercase;">{{ req.type }}</span>
        </div>
      </div>
    </div>

    <div class="actions">
      
      <div class="btn-group">
        <div class="group-label" style="color: #60a5fa;">FABRICAR 🔨</div>
        <div class="grid-3">
          <button class="btn btn-craft" (click)="craftOne()" [disabled]="maxCraftable() < 1">1</button>
          <button class="btn btn-craft" (click)="craftTen()" [disabled]="maxCraftable() < 10">10</button>
          <button class="btn btn-craft" (click)="craftAll()" [disabled]="maxCraftable() === 0">MAX</button>
        </div>
      </div>
      
      <div class="btn-group">
        <div class="group-label" style="color: #fbbf24;">VENDER 💰</div>
        <div class="grid-3">
          <button class="btn btn-sell" (click)="sellOne()" [disabled]="product.stock < 1">1</button>
          <button class="btn btn-sell" (click)="sellTen()" [disabled]="product.stock < 10">10</button>
          <button class="btn btn-sell" (click)="sellAll()" [disabled]="product.stock === 0">MAX</button>
        </div>
      </div>

    </div>
    
    <div style="text-align: right; font-size: 0.65rem; color: #94a3b8; margin-top: 6px;">
       Precio/Unidad: <span style="color: #fbbf24; font-weight: bold;">{{ product.sellPrice }} €</span>
    </div>

  </div>
</div>
