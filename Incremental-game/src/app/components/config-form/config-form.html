<div class="config-panel">
  
  <!-- Audio -->
  <div class="option-group">
    <span class="option-label">Audio & Notificaciones</span>
    
    <div class="control-row">
      <span class="control-name">Volumen Maestro ({{ settings.volume }}%)</span>
      <div class="range-track" (click)="setVolume($event)">
        <div class="range-fill" [style.width.%]="settings.volume">
          <div class="range-thumb"></div>
        </div>
      </div>
    </div>

    <div class="control-row" (click)="toggleSfx()">
      <span class="control-name">Efectos SFX</span>
      <div class="toggle" [class.active]="settings.sfxEnabled">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <!-- Gameplay -->
  <div class="option-group">
    <span class="option-label">Sistema</span>
    
    <div class="control-row" (click)="toggleNotifications()">
      <span class="control-name">Notificaciones Pop-up</span>
      <div class="toggle" [class.active]="settings.notificationsEnabled">
        <div class="toggle-knob"></div>
      </div>
    </div>
    
    <div class="control-row" (click)="togglePowerMode()">
      <span class="control-name">Modo Ahorro Energía</span>
      <div class="toggle" [class.active]="settings.powerSavingMode">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <button (click)="save()" class="btn-save">
    Confirmar y Guardar
  </button>

</div>
