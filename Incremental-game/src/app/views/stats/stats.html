<app-menu></app-menu>

<h2>Ranking</h2>
<table>
  <tr>
    <th>Posición</th>
    <th>Usuario</th>
    <th>Puntos</th>
    <th>Monedas</th>
  </tr>
  <tr *ngFor="let user of users; let i = index">
    <td>{{ i + 1 }}</td>
    <td>{{ user.username }}</td>
    <td>{{ user.points }}</td>
    <td>{{ user.coins }}</td>
  </tr>
</table>
<a routerLink="/">Volver al Menú</a>
