<div class="game-container">
  
  <!-- HUD SUPERIOR (STICKY) -->
  <header class="hud">
    <div class="hud-top">
      
      <!-- Marca -->
      <div class="brand">
        <h1>TYCOON<span>INC.</span></h1>
      </div>

      <!-- Display Central de Dinero -->
      <div class="money-display">
        <span style="font-size: 1.5rem;">💰</span>
        <div>
          <span class="money-label">Capital Disponible</span>
          <div class="money-amount">{{ game.state().money() | number:'1.0-0' }} €</div>
        </div>
      </div>

      <!-- Botón Menú (Ahora abre el Drawer) -->
      <button (click)="toggleMenu()" class="nav-btn">
        <span class="menu-icon">☰</span> 
        <span class="hidden-mobile">Panel de control</span>
      </button>
    </div>

    <!-- Barra de Recursos (Scroll Horizontal) -->
    <div class="resources-bar">
      <div class="res-container">
        <div *ngFor="let res of game.state().resources()" class="res-item">
          <div class="res-icon">{{ res.icon }}</div>
          <div class="res-data">
            <span class="res-val">{{ res.amount | number:'1.0-0' }}</span>
            <span class="res-name">{{ res.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="dashboard">
    
    <!-- SECCIÓN IZQUIERDA: TRABAJADORES -->
    <section>
      <div class="section-header">
        <h2 class="section-title">
          <span class="accent-mark">///</span> Dept. Extracción
        </h2>
        <span class="status-badge online">● SISTEMAS EN LÍNEA</span>
      </div>
      
      <div class="grid-workers">
        <app-worker-item 
          *ngFor="let worker of game.state().workers()" 
          [worker]="worker">
        </app-worker-item>
      </div>
    </section>

    <!-- SECCIÓN DERECHA: FÁBRICA -->
    <section>
      <div class="section-header">
        <h2 class="section-title">
          <span class="accent-mark orange">///</span> Manufactura
        </h2>
        <span class="status-badge manual">OPERACIÓN MANUAL</span>
      </div>

      <div class="list-products">
        <app-product-item 
          *ngFor="let prod of game.state().products()" 
          [product]="prod">
        </app-product-item>
      </div>
    </section>

  </main>

  <!-- DRAWER / MENÚ LATERAL -->
  <div class="drawer-overlay" *ngIf="isMenuOpen" (click)="toggleMenu()"></div>
  
  <div class="drawer-panel" [class.open]="isMenuOpen">
    <div class="drawer-header">
      <h3>PANEL DE CONTROL</h3>
      <button class="close-btn" (click)="toggleMenu()">✕</button>
    </div>
    
    <div class="drawer-content">
      <p class="drawer-label">Gestión</p>
      
      <button (click)="navigateTo('/settings')" class="drawer-btn">
        <span class="icon">⚙️</span> Configuración
      </button>
      
      <button (click)="navigateTo('/stats')" class="drawer-btn">
        <span class="icon">🏆</span> Logros & Ranking
      </button>
      
      <button (click)="navigateTo('/credits')" class="drawer-btn">
        <span class="icon">👥</span> Créditos
      </button>
      
      <button (click)="navigateTo('/menu')" class="drawer-btn exit">
        <span class="icon">🚪</span> Volver al Menú Principal
      </button>
    </div>
    
    <div class="drawer-footer">
      Tycoon System v0.2.1
    </div>
  </div>

</div>
