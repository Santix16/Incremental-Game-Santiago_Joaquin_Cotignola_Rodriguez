<h2>Juego</h2>
<button routerLink="/">Volver al Menú</button>

<div class="hud">
  <p>Nivel: {{ game.state().level() }}</p>
  <p>Clicks: {{ game.state().clicks() }}</p>
  <p>Puntos: {{ game.state().points() }} / {{ game.pointsRequiredForLevel() }}</p>
  <p>Monedas: {{ game.state().coins() }}</p>
</div>

<button (click)="game.click()">Click!</button>
<button routerLink="/shop">Ir a Tienda</button>
