<h2>Login</h2>
<form (ngSubmit)="login()">
  <label>Usuario:</label>
  <input [(ngModel)]="username" name="username" required>
  <label>Contraseña:</label>
  <input type="password" [(ngModel)]="password" name="password" required>
  <button type="submit">Entrar</button>
</form>
<a routerLink="/register">Registrarse</a>
