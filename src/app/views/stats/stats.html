<div class="stats-container">
  <div class="stats-card">

    <div class="card-header">
      <button class="tab-btn" [class.active]="activeTab === 'achievements'" (click)="setTab('achievements')">
        Logros
      </button>

    </div>

    <div class="card-body">

      <!-- Pestaña Logros -->
      <div *ngIf="activeTab === 'achievements'" class="achievements-grid">
        <div *ngFor="let ach of game.state().achievements()"
             class="achievement-item"
             [class.unlocked]="ach.unlocked">
          <div class="ach-icon">{{ ach.unlocked ? ach.icon : '🔒' }}</div>
          <div class="ach-name">{{ ach.name }}</div>
          <div class="ach-desc">{{ ach.description }}</div>
          <div class="ach-status">{{ ach.unlocked ? 'Desbloqueado' : 'Bloqueado' }}</div>
        </div>
      </div>

    <div class="card-footer">
      <button routerLink="/menu" class="btn-back">Volver al Menú Principal</button>
    </div>

  </div>
</div>
